services:
  postgres:
    image: postgres:16-alpine
    container_name: pets-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pets
    ports:
      - "5432:5432"
    volumes:
      - pets-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pets"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pets-pgdata:
